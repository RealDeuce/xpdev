name: Build and ABI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elf-symbol-versions:
    name: ELF symbol versions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify removed semaphore APIs stay absent
        run: |
          if grep -E '(sem_getvalue|xp_sem_getvalue|xp_sem_setvalue)' \
              semwrap.c semwrap.h xpsem.c xpsem.h cmake/xpdev.map; then
            echo 'Removed semaphore query or count-mutation API was restored' >&2
            exit 1
          fi

      - name: Verify caller-local allocation helpers stay out of the ABI
        run: |
          if grep -E '^\s*(realloc_or_free|stbuf_frommem);' cmake/xpdev.map; then
            echo 'Caller-local allocation helper was restored to the shared ABI' >&2
            exit 1
          fi

      - name: Install audio development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libasound2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            portaudio19-dev \
            pkg-config

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DWITHOUT_COREAUDIO=ON
          -DWITHOUT_SDL_AUDIO=ON

      - name: Build libraries
        run: cmake --build build --config Release

      - name: Verify symbol versions
        run: |
          ./.github/scripts/check-symbol-versions.sh build/libxpdev.so XPDEV_1.0
          ./.github/scripts/check-symbol-versions.sh build/comio/libxpdev-comio.so XPDEV_COMIO_1.0
          ./.github/scripts/check-symbol-versions.sh build/hash/libxpdev-hash.so XPDEV_HASH_1.0
          ./.github/scripts/check-symbol-versions.sh build/encode/libxpdev-encode.so XPDEV_ENCODE_1.0

          unexpected_xp_sem_exports="$(
            readelf -W -s -D build/libxpdev.so \
              | awk '
                  $1 ~ /^[0-9]+:$/ && $7 != "UND" {
                    name = $8
                    sub(/@.*/, "", name)
                    if (name ~ /^xp_sem_/ && name != "xp_sem_trywait_block")
                      print name
                  }' \
              | sort -u
          )"
          if test -n "$unexpected_xp_sem_exports"; then
            printf '%s\n' "$unexpected_xp_sem_exports" >&2
            echo 'Native POSIX build exported XP semaphore fallback symbols' >&2
            exit 1
          fi

      - name: Verify installed CMake package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/xpdev-install"
          cmake -S tests/package-consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/xpdev-install" \
            -DXPDEV_CONSUMER_REQUIRE_NATIVE_POSIX_SEMAPHORES=ON \
            -DXPDEV_CONSUMER_EXPECT_AUDIO_BACKENDS=PORTAUDIO,PIPEWIRE,PULSEAUDIO,ALSA,OSS
          cmake --build consumer-build
          cmake -E env \
            "LD_LIBRARY_PATH=$RUNNER_TEMP/xpdev-install/lib" \
            ctest --test-dir consumer-build --output-on-failure

      - name: Verify installed pkg-config modules
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/xpdev-install/lib/pkgconfig"
          pkg-config --validate \
            "$PKG_CONFIG_PATH/xpdev.pc" \
            "$PKG_CONFIG_PATH/xpdev-comio.pc" \
            "$PKG_CONFIG_PATH/xpdev-encode.pc" \
            "$PKG_CONFIG_PATH/xpdev-hash.pc"
          test "$(pkg-config --variable=audio_enabled xpdev)" = true
          test "$(pkg-config --variable=audio_backends xpdev)" = \
            PORTAUDIO,PIPEWIRE,PULSEAUDIO,ALSA,OSS
          cc tests/pkg-config-consumer.c \
            $(pkg-config --cflags --libs \
              xpdev-comio xpdev-encode xpdev-hash) \
            -o pkg-config-consumer-shared
          LD_LIBRARY_PATH="$RUNNER_TEMP/xpdev-install/lib" \
            ./pkg-config-consumer-shared
          cc tests/pkg-config-consumer.c -Wl,-Bstatic \
            $(pkg-config --cflags --libs --static \
              xpdev-comio xpdev-encode xpdev-hash) \
            -Wl,-Bdynamic -o pkg-config-consumer-static
          ./pkg-config-consumer-static

  native-library-metadata:
    name: Native library metadata (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppleClang
            os: macos-latest
            audio_options: >-
              -DWITHOUT_ALSA=ON
              -DWITHOUT_COREAUDIO=OFF
              -DWITHOUT_OSS=ON
              -DWITHOUT_PIPEWIRE=ON
              -DWITHOUT_PORTAUDIO=OFF
              -DWITHOUT_PULSEAUDIO=ON
              -DWITHOUT_SDL_AUDIO=ON
            expected_audio_backends: COREAUDIO,PORTAUDIO
          - name: MSVC
            os: windows-latest
            audio_options: >-
              -DWITHOUT_ALSA=ON
              -DWITHOUT_COREAUDIO=ON
              -DWITHOUT_OSS=ON
              -DWITHOUT_PIPEWIRE=ON
              -DWITHOUT_PORTAUDIO=ON
              -DWITHOUT_PULSEAUDIO=ON
              -DWITHOUT_SDL_AUDIO=ON
            expected_audio_backends: WASAPI
            msvc_runtime: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          - name: MSVC-static-CRT
            os: windows-latest
            audio_options: >-
              -DWITHOUT_ALSA=ON
              -DWITHOUT_COREAUDIO=ON
              -DWITHOUT_OSS=ON
              -DWITHOUT_PIPEWIRE=ON
              -DWITHOUT_PORTAUDIO=ON
              -DWITHOUT_PULSEAUDIO=ON
              -DWITHOUT_SDL_AUDIO=ON
            expected_audio_backends: WASAPI
            msvc_runtime: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install macOS audio dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pkgconf portaudio
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.msvc_runtime }}
          ${{ matrix.audio_options }}

      - name: Build libraries
        run: cmake --build build --config Release

      - name: Verify Mach-O metadata and exports
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dylib="$(find build -name 'libxpdev.1.dylib' -print -quit)"
          test -n "$dylib"
          otool -D "$dylib" | grep -q 'libxpdev\.1\.dylib'
          otool -L "$dylib" \
            | grep -q 'compatibility version 1\.0\.0, current version 1\.0\.0'
          ! nm -gjU "$dylib" \
            | grep -E '^_(asprintf|getch|getdelim|globi|kbhit|msclock|pthread_.*|realloc_or_free|sem_getvalue|sem_trywait_block|stbuf_frommem|strndup|unix_beep|vasprintf|alsa_api|init_sdl_audio|pa_api|pu_api|sdl_fillbuf|xp_mixer_pull|xp_sem_getvalue|xp_sem_setvalue|xpbeep_load_sdl_funcs|xpbeep_sdl|xptone_close_locked)$'
          for component in comio hash encode; do
            dylib="$(find build -name "libxpdev-${component}.1.dylib" -print -quit)"
            test -n "$dylib"
            otool -D "$dylib" | grep -q "libxpdev-${component}\.1\.dylib"
            otool -L "$dylib" \
              | grep -q 'compatibility version 1\.0\.0, current version 1\.0\.0'
            diff -u \
              <(LC_ALL=C sort "cmake/xpdev-${component}.exports") \
              <(nm -gjU "$dylib" | LC_ALL=C sort)
          done

      - name: Verify PE filename and exports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -File -Filter 'xpdev-1.dll' |
            Select-Object -First 1
          if (-not $dll) { throw 'xpdev-1.dll was not produced' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $exports = cmd.exe /d /s /c "`"$vcvars`" >nul && dumpbin /nologo /exports `"$($dll.FullName)`""
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $exportText = $exports -join "`n"
          if ($exportText -notmatch '\sxp_pthread_mutex_init\s') {
            throw 'expected XPDev exports were not found'
          }
          @(
            'dataLineAlloc',
            'dataLineFree',
            'iniFreeEnumList',
            'iniFreeIntList',
            'listAllocData',
            'listFreeData',
            'msgQueueFreeMessage',
            'namedStrListFree',
            'namedStrListReplace',
            'namedStrListSetName',
            'namedStrListSetValue',
            'rwlock_destroy',
            'rwlock_init',
            'rwlock_rdlock',
            'rwlock_tryrdlock',
            'rwlock_trywrlock',
            'rwlock_unlock',
            'rwlock_wrlock',
            'strListAllocString',
            'strListFreeContainer',
            'strListFreeString',
            'xp_audio_buffer_alloc',
            'xp_audio_buffer_free',
            'xpdev_sem_destroy_impl',
            'xpdev_sem_init_impl',
            'xpdev_sem_post_impl',
            'xpdev_sem_trywait_block_impl'
          ) | ForEach-Object {
            if ($exportText -notmatch "\s$([regex]::Escape($_))\s") {
              throw "expected XPDev export was not found: $_"
            }
          }
          if ($exportText -match '\s(alsa_api|asprintf|getch|getdelim|globi|init_sdl_audio|kbhit|msclock|pa_api|pthread_mutex_init_np|pthread_mutex_initializer_np|pu_api|realloc_or_free|sdl_fillbuf|sem_destroy|sem_getvalue|sem_init|sem_post|sem_trywait_block|stbuf_frommem|strndup|unix_beep|vasprintf|xp_mixer_pull|xp_pthread_mutex_initializer|xp_sem_getvalue|xp_sem_setvalue|xp_sem_trywait_block|xpbeep_load_sdl_funcs|xpbeep_sdl|xptone_close_locked)\s') {
            throw "internal or legacy implementation symbol was exported: $($Matches[1])"
          }

          $componentExports = @{
            'xpdev-comio-1.dll' = 'comVersion'
            'xpdev-hash-1.dll' = 'SHA256Init'
            'xpdev-encode-1.dll' = 'b64_encode'
          }
          foreach ($entry in $componentExports.GetEnumerator()) {
            $componentDll = Get-ChildItem build -Recurse -File -Filter $entry.Key |
              Select-Object -First 1
            if (-not $componentDll) { throw "$($entry.Key) was not produced" }
            $componentTable = cmd.exe /d /s /c "`"$vcvars`" >nul && dumpbin /nologo /exports `"$($componentDll.FullName)`""
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $($entry.Key)" }
            $componentText = $componentTable -join "`n"
            if ($componentText -notmatch "\s$([regex]::Escape($entry.Value))\s") {
              throw "$($entry.Value) was not exported by $($entry.Key)"
            }
            if ($componentText -match '\s(rate_to_macro|macro_to_rate)\s') {
              throw "internal symbol was exported: $($Matches[1])"
            }
          }

      - name: Verify installed CMake package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --install build --config Release \
            --prefix "$RUNNER_TEMP/xpdev-install"
          cmake -S tests/package-consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/xpdev-install" \
            -DXPDEV_CONSUMER_REQUIRE_XP_SEMAPHORES=ON \
            -DXPDEV_CONSUMER_EXPECT_AUDIO_BACKENDS=${{ matrix.expected_audio_backends }}
          cmake --build consumer-build --config Release
          ctest --test-dir consumer-build -C Release --output-on-failure
          export PKG_CONFIG_PATH="$RUNNER_TEMP/xpdev-install/lib/pkgconfig"
          pkg-config --validate "$PKG_CONFIG_PATH"/*.pc
          pkg-config --libs --static xpdev \
            | grep -q -- '-framework AudioToolbox'
          cc tests/pkg-config-consumer.c \
            $(pkg-config --cflags --libs \
              xpdev-comio xpdev-encode xpdev-hash) \
            -o pkg-config-consumer-shared
          DYLD_LIBRARY_PATH="$RUNNER_TEMP/xpdev-install/lib" \
            ./pkg-config-consumer-shared

      - name: Verify installed CMake package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'xpdev-install'
          cmake --install build --config Release --prefix $prefix
          cmake -S tests/package-consumer -B consumer-build `
            "-DCMAKE_PREFIX_PATH=$prefix" `
            "${{ matrix.msvc_runtime }}" `
            "-DXPDEV_CONSUMER_EXPECT_AUDIO_BACKENDS=${{ matrix.expected_audio_backends }}"
          cmake --build consumer-build --config Release
          $env:PATH = "$(Join-Path $prefix 'bin');$env:PATH"
          ctest --test-dir consumer-build -C Release --output-on-failure

          $pcdir = Join-Path $prefix 'lib\pkgconfig'
          @(
            'xpdev.pc',
            'xpdev-static.pc',
            'xpdev-comio.pc',
            'xpdev-comio-static.pc',
            'xpdev-encode.pc',
            'xpdev-encode-static.pc',
            'xpdev-hash.pc',
            'xpdev-hash-static.pc'
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $pcdir $_))) {
              throw "pkg-config module was not installed: $_"
            }
          }
          $dynamicPc = Get-Content -Raw (Join-Path $pcdir 'xpdev.pc')
          if ($dynamicPc -notmatch '-lxpdev-1' -or
              $dynamicPc -notmatch '-DWRAPPER_IMPORTS') {
            throw 'xpdev.pc does not describe the DLL import interface'
          }
          $staticPc = Get-Content -Raw (Join-Path $pcdir 'xpdev-static.pc')
          if ($staticPc -notmatch '-lxpdev_static' -or
              $staticPc -match 'WRAPPER_IMPORTS' -or
              $staticPc -notmatch '-liphlpapi') {
            throw 'xpdev-static.pc does not describe the static interface'
          }

  mingw-w64:
    name: MinGW-w64 UCRT64 system pthreads
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MinGW-w64 UCRT64 toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: diffutils
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            portaudio:p

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DWITHOUT_ALSA=ON
          -DWITHOUT_COREAUDIO=ON
          -DWITHOUT_OSS=ON
          -DWITHOUT_PIPEWIRE=ON
          -DWITHOUT_PULSEAUDIO=ON
          -DWITHOUT_SDL_AUDIO=ON

      - name: Build libraries
        run: cmake --build build

      - name: Verify PE filenames and exports
        run: |
          export_names() {
            objdump -p "$1" | sed -n -E \
              '/^\[Ordinal\/Name Pointer\] Table/,/^\r?$/ s/^[[:space:]]*\[[[:space:]]*[0-9]+\].*[[:space:]]([^[:space:]\r]+)\r?$/\1/p'
          }

          core_dll="$(find build -type f -name 'libxpdev-1.dll' -print -quit)"
          test -n "$core_dll"
          grep -q '^#define XPDEV_USE_SYSTEM_PTHREADS 1$' \
            build/xpdev_config.h
          objdump -p "$core_dll" | grep -qi 'DLL Name:.*winpthread'
          export_names "$core_dll" | LC_ALL=C sort >build/mingw-core-exports.txt
          grep -qx xp_pthread_mutex_init build/mingw-core-exports.txt
          for symbol in dataLineAlloc dataLineFree iniFreeEnumList iniFreeIntList \
              listAllocData listFreeData msgQueueFreeMessage namedStrListFree \
              namedStrListReplace namedStrListSetName namedStrListSetValue \
              rwlock_destroy rwlock_init rwlock_rdlock \
              rwlock_tryrdlock rwlock_trywrlock rwlock_unlock rwlock_wrlock; do
            grep -qx "$symbol" build/mingw-core-exports.txt
          done
          for symbol in strListAllocString strListFreeContainer \
              strListFreeString xp_audio_buffer_alloc xp_audio_buffer_free \
              xpdev_sem_destroy_impl xpdev_sem_init_impl xpdev_sem_post_impl \
              xpdev_sem_trywait_block_impl; do
            grep -qx "$symbol" build/mingw-core-exports.txt
          done
          if grep -E \
              '^(alsa_api|asprintf|getch|getdelim|globi|init_sdl_audio|kbhit|msclock|pa_api|pthread_.*|pu_api|realloc_or_free|sdl_fillbuf|sem_destroy|sem_getvalue|sem_init|sem_post|sem_trywait_block|stbuf_frommem|strndup|unix_beep|vasprintf|xp_mixer_pull|xp_pthread_mutex_initializer|xp_sem_getvalue|xp_sem_setvalue|xp_sem_trywait_block|xpbeep_load_sdl_funcs|xpbeep_sdl|xptone_close_locked)$' \
              build/mingw-core-exports.txt; then
            echo 'MinGW DLL exported an internal or legacy implementation symbol' >&2
            exit 1
          fi

          for component in comio hash encode; do
            dll="$(find build -type f -name "libxpdev-${component}-1.dll" -print -quit)"
            test -n "$dll"
            awk 'NR > 1 { print $1 }' "cmake/xpdev-${component}.def" \
              | LC_ALL=C sort >"build/mingw-${component}-expected.txt"
            export_names "$dll" | LC_ALL=C sort \
              >"build/mingw-${component}-actual.txt"
            diff -u "build/mingw-${component}-expected.txt" \
              "build/mingw-${component}-actual.txt"
          done

      - name: Verify installed CMake package
        run: |
          prefix="$(cygpath -u "$RUNNER_TEMP")/xpdev-install"
          cmake --install build --prefix "$prefix"
          cmake -S tests/package-consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DXPDEV_CONSUMER_EXPECT_AUDIO_BACKENDS=WASAPI,PORTAUDIO
          cmake --build consumer-build
          PATH="$prefix/bin:$PATH" \
            ctest --test-dir consumer-build --output-on-failure

      - name: Verify installed pkg-config modules
        run: |
          prefix="$(cygpath -u "$RUNNER_TEMP")/xpdev-install"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --validate "$PKG_CONFIG_PATH"/*.pc
          pkg-config --cflags xpdev | grep -q -- -DWRAPPER_IMPORTS
          pkg-config --libs xpdev | grep -q -- -lxpdev-1
          pkg-config --cflags xpdev-hash-static \
            | grep -q -- -DXPDEV_HASH_STATIC
          pkg-config --libs xpdev-static | grep -q -- -lxpdev_static
          pkg-config --libs xpdev-static \
            | grep -Eq -- '(^| )(-pthread|-l(win)?pthread)( |$)'
          test "$(pkg-config --variable=audio_backends xpdev-static)" = \
            WASAPI,PORTAUDIO
          gcc tests/pkg-config-consumer.c \
            $(pkg-config --cflags --libs \
              xpdev-comio xpdev-encode xpdev-hash) \
            -o pkg-config-consumer-shared.exe
          PATH="$prefix/bin:$PATH" ./pkg-config-consumer-shared.exe
          gcc tests/pkg-config-consumer.c \
            $(pkg-config --cflags --libs \
              xpdev-comio-static xpdev-encode-static xpdev-hash-static) \
            -o pkg-config-consumer-static.exe
          ./pkg-config-consumer-static.exe

  mingw-w64-win32-threads:
    name: MinGW-w64 Win32-thread wrappers
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install prebuilt MinGW-w64 Win32-thread toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mingw-win32.7z'
          $destination = Join-Path $env:RUNNER_TEMP 'mingw-win32'
          $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-win32-seh-ucrt-rt_v14-rev1.7z'
          curl.exe -L --fail --silent --show-error -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'MinGW-w64 download failed' }
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expectedHash = 'c9ae8e4a3afa667b3301dd28c567109d174a0fa0856a2eeaa85a91b89569a50b'
          if ($actualHash -ne $expectedHash) {
            throw "MinGW-w64 archive checksum mismatch: $actualHash"
          }
          & 7z x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0) { throw 'MinGW-w64 extraction failed' }
          $bin = Join-Path $destination 'mingw64\bin'
          if (-not (Test-Path (Join-Path $bin 'gcc.exe'))) {
            throw 'MinGW-w64 compiler was not found after extraction'
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify compiler thread model
        run: |
          test "$(gcc -dumpmachine)" = x86_64-w64-mingw32
          gcc -v 2>&1 | grep -q '^Thread model: win32$'

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_RC_COMPILER=windres
          -DWITHOUT_ALSA=ON
          -DWITHOUT_COREAUDIO=ON
          -DWITHOUT_OSS=ON
          -DWITHOUT_PIPEWIRE=ON
          -DWITHOUT_PORTAUDIO=ON
          -DWITHOUT_PULSEAUDIO=ON
          -DWITHOUT_SDL_AUDIO=ON

      - name: Build libraries
        run: cmake --build build

      - name: Verify Win32 thread implementation
        run: |
          grep '^#define XPDEV_USE_SYSTEM_PTHREADS ' build/xpdev_config.h
          grep -q '^#define XPDEV_USE_SYSTEM_PTHREADS 0$' \
            build/xpdev_config.h

          core_dll="$(find build -type f -name 'libxpdev-1.dll' -print -quit)"
          test -n "$core_dll"
          ! objdump -p "$core_dll" \
            | grep -qi 'DLL Name:.*winpthread'

          export_names() {
            objdump -p "$1" | sed -n -E \
              '/^\[Ordinal\/Name Pointer\] Table/,/^\r?$/ s/^[[:space:]]*\[[[:space:]]*[0-9]+\].*[[:space:]]([^[:space:]\r]+)\r?$/\1/p'
          }

          export_names "$core_dll" | LC_ALL=C sort \
            >build/mingw-win32-core-exports.txt
          grep -qx pthread_mutex_init build/mingw-win32-core-exports.txt
          grep -qx pthread_once build/mingw-win32-core-exports.txt
          grep -qx xp_pthread_mutex_init build/mingw-win32-core-exports.txt
          for symbol in rwlock_destroy rwlock_init rwlock_rdlock \
              rwlock_tryrdlock rwlock_trywrlock rwlock_unlock rwlock_wrlock; do
            grep -qx "$symbol" build/mingw-win32-core-exports.txt
          done
          for symbol in dataLineAlloc dataLineFree iniFreeEnumList iniFreeIntList \
              listAllocData listFreeData msgQueueFreeMessage namedStrListFree \
              namedStrListReplace namedStrListSetName namedStrListSetValue \
              strListAllocString strListFreeContainer strListFreeString \
              xp_audio_buffer_alloc xp_audio_buffer_free xpdev_sem_destroy_impl \
              xpdev_sem_init_impl xpdev_sem_post_impl \
              xpdev_sem_trywait_block_impl; do
            grep -qx "$symbol" build/mingw-win32-core-exports.txt
          done
          if grep -E \
              '^(alsa_api|asprintf|getch|getdelim|globi|init_sdl_audio|kbhit|msclock|pa_api|pthread_.*_np|pu_api|realloc_or_free|sdl_fillbuf|sem_destroy|sem_getvalue|sem_init|sem_post|sem_trywait_block|stbuf_frommem|strndup|unix_beep|vasprintf|xp_mixer_pull|xp_pthread_mutex_initializer|xp_sem_getvalue|xp_sem_setvalue|xp_sem_trywait_block|xpbeep_load_sdl_funcs|xpbeep_sdl|xptone_close_locked)$' \
              build/mingw-win32-core-exports.txt; then
            echo 'MinGW Win32-thread DLL exported an internal symbol' >&2
            exit 1
          fi

          for component in comio hash encode; do
            dll="$(find build -type f -name "libxpdev-${component}-1.dll" -print -quit)"
            test -n "$dll"
            awk 'NR > 1 { print $1 }' "cmake/xpdev-${component}.def" \
              | LC_ALL=C sort >"build/mingw-win32-${component}-expected.txt"
            export_names "$dll" | LC_ALL=C sort \
              >"build/mingw-win32-${component}-actual.txt"
            diff -u "build/mingw-win32-${component}-expected.txt" \
              "build/mingw-win32-${component}-actual.txt"
          done

      - name: Verify installed CMake package
        run: |
          prefix="$(cygpath -u "$RUNNER_TEMP")/xpdev-install"
          cmake --install build --prefix "$prefix"
          cmake -S tests/package-consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_RC_COMPILER=windres \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DXPDEV_CONSUMER_EXPECT_AUDIO_BACKENDS=WASAPI
          cmake --build consumer-build
          PATH="$prefix/bin:$PATH" \
            ctest --test-dir consumer-build --output-on-failure
          test -f "$prefix/lib/pkgconfig/xpdev.pc"
          test -f "$prefix/lib/pkgconfig/xpdev-static.pc"
          grep -q -- '-lxpdev-1' "$prefix/lib/pkgconfig/xpdev.pc"
          grep -q -- '-lxpdev_static' "$prefix/lib/pkgconfig/xpdev-static.pc"
          ! grep -Ei '(^|[^[:alpha:]])(win)?pthread' \
            "$prefix/lib/pkgconfig/xpdev.pc" \
            "$prefix/lib/pkgconfig/xpdev-static.pc"
