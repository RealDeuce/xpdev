name: Sync from Synchronet upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-synchronet-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Integrate src/xpdev
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out complete standalone history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch, project, and merge upstream
        run: ./.github/scripts/sync-upstream.sh

      - name: Push integrated history
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}"
